name: Daily PromptAtlas Content

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Discover keywords
        run: npm run keywords:discover

      - name: Generate daily content
        run: npm run content:auto

      - name: Check image status
        run: npm run images:dry-run

      - name: Build
        run: npm run build

      - name: Commit generated content
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No generated changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content public/images/keywords scripts package.json package-lock.json .github/workflows/daily-content.yml
          git commit -m "Generate daily PromptAtlas content"
          git push
